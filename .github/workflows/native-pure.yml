name: native-pure

# Phase 13 v2.8.4: pure-layer native gates (no PowerPoint required).
#
# Manual dispatch only while the native add-in is parked (DECISIONS.md D1).
# It had failed on every run since 2026-08-07 — `ilammy/msvc-dev-cmd` cannot
# find vcvars on the current windows-latest image — so it reported red on
# pushes that merely touched spec/fixtures, for a component nobody is working
# on. A permanently red check teaches people to ignore checks.
#
# Unparking native means fixing the MSVC setup step and restoring the push and
# pull_request triggers on the paths below:
#   native/**, spec/fixtures/**, docs/design-tokens.md, this file.
on:
  workflow_dispatch:

jobs:
  pure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build conformance + ops + unit harnesses
        shell: cmd
        run: |
          call native\build-conformance.bat
          if errorlevel 1 exit /b 1
          call native\build-ops.bat
          if errorlevel 1 exit /b 1
          call native\build-unit.bat
          if errorlevel 1 exit /b 1

      - name: Theme token parity
        shell: pwsh
        run: python native/tools/check_theme_tokens.py
